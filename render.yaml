services:
  - type: web
    name: buy-and-sell-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPERADMIN_TELEGRAM_ID
        sync: false
      - key: PUBLIC_CHANNEL_ID
        sync: false
      - key: PUBLIC_CHANNEL_USERNAME
        sync: false
